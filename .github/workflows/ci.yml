# Verification continue.
#
# Ce workflow ne deploie RIEN : le site est construit et publie par Cloudflare
# Pages a chaque push (voir tools/deploy.py). Son role est d'afficher
# l'etat des donnees et des tests sur le depot lui-meme, pour qu'une erreur
# saute aux yeux sans avoir a ouvrir le journal d'un autre service.
#
# Il n'installe pas Zola : la construction du site est verifiee par le
# deploiement Cloudflare, qui echoue et ne publie rien si un template casse.
# Garder ce workflow en Python pur le rend rapide et sans dependance.

name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests unitaires
        run: python -m unittest discover -s tests -t .

      # Donnee invalide : sortie non nulle, et le workflow echoue.
      - name: Validation des donnees
        run: python -m tools.build --check
