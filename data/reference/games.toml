# Les jeux de la collection.
#
# Champs volontairement ABSENTS a ce stade, a remplir par l'utilisateur :
#   released     annee de sortie occidentale
#   played_from  premier mois joue, format "YYYY-MM"
#   played_to    dernier mois joue, format "YYYY-MM"
#
# played_from et played_to sont des donnees PERSONNELLES : elles alimentent la
# timeline de carriere et datent les vues croisees. Aucun agent ne doit les
# deviner (AGENTS.md 2.3). Tant qu'elles sont absentes, la timeline reste vide,
# ce qui est le comportement correct.

