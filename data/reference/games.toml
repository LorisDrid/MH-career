# Les jeux de la collection.
#
# Champs volontairement ABSENTS a ce stade, a remplir par l'utilisateur :
#   released     annee de sortie occidentale
#   played_from  premier mois joue, format "YYYY-MM"
#   played_to    dernier mois joue, format "YYYY-MM"
#
# played_from et played_to sont des donnees PERSONNELLES : elles alimentent la
# timeline de carriere et datent les vues croisees. Aucun agent ne doit les
# deviner (AGENTS.md 2.3). Tant qu'elles sont absentes, la timeline reste vide,
# ce qui est le comportement correct.

[games.mh3u]
title = "Monster Hunter 3 Ultimate"
short_title = "MH3U"
platform = "nintendo_3ds"
generation = 3
status = "finished"
# Derniere session datee par le Journal chasseur (2025/08/22).
played_to = "2025-08"

[games.mh4u]
title = "Monster Hunter 4 Ultimate"
short_title = "MH4U"
platform = "nintendo_3ds"
generation = 4
status = "finished"
# Derniere session datee par le Journal de chasse (2016/07/18). Le debut reste
# inconnu : le journal ne conserve que les sessions recentes.
played_to = "2016-07"

[games.mhgen]
title = "Monster Hunter Generations"
short_title = "MHGen"
platform = "nintendo_3ds"
generation = 4
status = "finished"
# Derniere session datee par le Journal de chasse (2018/8/21).
played_to = "2018-08"

[games.mhw]
title = "Monster Hunter: World"
short_title = "MHW"
platform = "playstation_4"
generation = 5
status = "finished"

[games.mhrise]
title = "Monster Hunter Rise"
short_title = "MHRise"
# Game Pass sur PC : les captures sont des PNG Windows et la carte affiche un
# Gamertag. Ce n'est donc pas la version console.
platform = "pc"
generation = 5
status = "finished"

[games.mhwilds]
title = "Monster Hunter Wilds"
short_title = "MHWilds"
platform = "pc"
generation = 6
status = "planned"
