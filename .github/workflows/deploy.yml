# Deploiement du site sur GitHub Pages.
#
# PREALABLE MANUEL : dans Settings > Pages, choisir Source = "GitHub Actions".
# Sans cela, l'etape de deploiement echouera.
#
# Aucune installation de dependance n'est necessaire : le pipeline n'utilise que
# la bibliotheque standard de Python, et Zola est un binaire unique.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.22.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests unitaires
        run: python -m unittest discover -s tests -t .

      # Si une donnee est invalide, le build s'arrete ici avec un code non nul
      # et rien n'est deploye. C'est le comportement voulu : mieux vaut un
      # deploiement manque qu'une statistique fausse en ligne.
      - name: Generer data/generated/site.json
        run: python -m tools.build

      - name: Installer Zola ${{ env.ZOLA_VERSION }}
        run: |
          url="https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL "$url" -o zola.tar.gz
          # TODO: renseigner la somme de controle SHA-256 de l'archive, puis
          # decommenter la ligne suivante. Elle n'a pas pu etre calculee ici :
          # telecharger un binaire est interdit a l'agent (AGENTS.md 2.2).
          # echo "<sha256>  zola.tar.gz" | sha256sum -c -
          tar -xzf zola.tar.gz
          sudo install -m 755 zola /usr/local/bin/zola
          zola --version

      - name: Construire le site
        run: zola build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
