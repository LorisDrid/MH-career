# Referentiel canonique des monstres.
#
# Regles (voir docs/DATA-MODEL.md) :
#   - id en snake_case, JAMAIS de tiret : dans Tera, monsters.rathalos-azure
#     serait evalue comme la soustraction rathalos - azure
#   - id derive du nom ANGLAIS, qui est la forme stable entre les jeux
#   - une variante porte base + variant_type ; les deux ensemble ou aucun des deux
#   - une variante ne peut pas pointer vers une autre variante
#
# PROVENANCE : les noms FRANCAIS viennent des Guild Cards photographiees et font
# foi. Les noms ANGLAIS et les identifiants sont derives de ces noms FR et ne
# sont PAS lus a l'ecran : ils servent de cle technique stable et restent a
# confirmer. L'espece n'est volontairement pas renseignee, aucune Guild Card ne
# l'affichant.
#
# Ajoutes le 2026-09-15 depuis MH4U (Guild Card page 6/7, 38 monstres).


